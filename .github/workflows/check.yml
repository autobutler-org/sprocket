name: Check

on:
  workflow_dispatch:
  merge_group:
  # No base-branch filter: a PR stacked on another feature branch needs checking too.
  pull_request:

# cancel previous runs if new commits are pushed into the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Detect dirty go mod
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum

      - name: Check formatting
        run: |
          make format
          git diff --exit-code -- .

      - name: Lint
        run: |
          make check

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check for vulnerabilities
        run: make check/vuln
