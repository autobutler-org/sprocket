name: Performance

on:
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "0 7 * * *"
  # No base-branch filter: a PR stacked on another feature branch gets measured too.
  pull_request:

# cancel previous runs if new commits are pushed into the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compare against ffmpeg
        run: make test/perf

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: test-results/perf/
          if-no-files-found: warn
