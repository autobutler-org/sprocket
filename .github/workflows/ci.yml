name: Continuous Integration

on:
  workflow_dispatch:
  merge_group:
  # Also on push to main so the badges have a run attributed to the branch. Without it
  # every run belongs to a pull request's head ref and a ?branch=main badge reads
  # "no status".
  push:
    branches: [main]
  # No base-branch filter: a PR stacked on another feature branch needs building too.
  pull_request:

# cancel previous runs if new commits are pushed into the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Test
        env:
          PRINT_COVERAGE: true
        run: make test
