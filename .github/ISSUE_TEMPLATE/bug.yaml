name: Bug Report
description: File a bug report.
title: "[Bug] "
labels: ["bug"]
type: Bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also, what did you expect to happen?
      placeholder: What is going on?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How do we reproduce it?
      description: A minimal Go snippet, and the input file if the bug depends on one.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sprocket version
      description: The version in your go.mod, or the commit if you are on a pseudo-version.
      placeholder: "e.g. v0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: "e.g. darwin/arm64, linux/amd64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
